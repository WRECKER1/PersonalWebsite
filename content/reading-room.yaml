    by: Warren Buffett
    source: Berkshire Hathaway shareholder letter, 2008
  - text: You can't predict. You can prepare.
    by: Howard Marks
    source: Oaktree memo, 2001
  - text: In the short run, the market is a voting machine but in the long run it is a weighing machine.
    by: Benjamin Graham
    source: as quoted by Warren Buffett
  - text: Invert, always invert.
    by: Carl Jacobi
    source: a favourite maxim of Charlie Munger

